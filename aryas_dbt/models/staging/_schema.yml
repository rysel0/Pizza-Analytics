version: 2
 
models:
  - name: stg_menu
    description: "Dish catalog with calculated margin"
    columns:
      - name: dish_id
        description: "Unique dish identifier"
        tests:
          - not_null
          - unique
      - name: price
        tests:
          - not_null
 
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
 
  - name: stg_order_items
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: dish_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_menu')
              field: dish_id